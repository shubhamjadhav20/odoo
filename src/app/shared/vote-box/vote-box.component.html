<div class="vote-box">
  <button
    (click)="upvote()"
    [ngClass]="{ active: lastAction === 'up' }"
    aria-label="Upvote"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <div class="vote-number-container">
    <div
      class="vote-number"
      [ngClass]="{
        'scroll-up': direction === 'up',
        'scroll-down': direction === 'down'
      }"
      (animationend)="direction = null"
    >
      {{ votes || 0 }}
    </div>
  </div>

  <button
    (click)="downvote()"
    [ngClass]="{ active: lastAction === 'down' }"
    aria-label="Downvote"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </button>
</div>
