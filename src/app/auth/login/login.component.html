<div class="login-container">
    <div class="login-card">
      <div class="login-card-header">
        <h2>Welcome Back</h2>
        <p>Please enter your credentials to login</p>
      </div>
      
      <form (ngSubmit)="onSubmit()" class="login-card-body">
        <div class="login-form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" 
                 [(ngModel)]="email" required style="width: 90%;"
                 placeholder="Enter your email">
        </div>
        
        <div class="login-form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" 
                 [(ngModel)]="password" required style="width: 90%;"
                 placeholder="••••••••">
        </div>
        
        <div *ngIf="errorMessage" class="login-error">
          {{ errorMessage }}
        </div>
        
        <button type="submit" class="login-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>
        
        <div class="login-footer">
          <p>Don't have an account? <a routerLink="/signup">Sign up</a></p>
          <a routerLink="/forgot-password" class="forgot-password">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>
